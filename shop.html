<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Malawi Shop</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#145A32;color:white;text-align:center;padding:30px 15px}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0;font-size:16px}
.container{max-width:900px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:15px}
.card-body h3{margin:0 0 8px}
.price{color:#145A32;font-weight:bold;font-size:18px;margin-bottom:12px}
.btn{display:block;text-align:center;background:#25D366;color:white;text-decoration:none;padding:12px;border-radius:8px;font-weight:bold}
.btn:hover{background:#1da851}
footer{text-align:center;padding:20px;font-size:14px;color:#777}
</style>
</head>
<body>

<header>
<h1>Connect Malawi Shop</h1>
<p>Call/WhatsApp: 0999447090</p>
</header>

<div class="container">

<div class="card">
<img src="https://via.placeholder.com/600x400/145A32/ffffff?text=Phone+Cover" alt="Premium Phone Cover">
<div class="card-body">
<h3>Premium Phone Cover</h3>
<p class="price">MK 8,000</p>
<a class="btn" href="https://wa.me/265999447090?text=Hello%20Connect%20Malawi%20Shop!%20I%20want%20to%20order%20Premium%20Phone%20Cover%20(MK%208%2C000)" target="_blank">Order on WhatsApp</a>
</div>
</div>

<div class="card">
<img src="https://via.placeholder.com/600x400/111/ffffff?text=Wireless+Earphones" alt="Wireless Earphones">
<div class="card-body">
<h3>Wireless Earphones</h3>
<p class="price">MK 15,000</p>
<a class="btn" href="https://wa.me/265999447090?text=Hello%20Connect%20Malawi%20Shop!%20I%20want%20to%20order%20Wireless%20Earphones%20(MK%2015%2C000)" target="_blank">Order on WhatsApp</a>
</div>
</div>

</div>

<footer>Connect Malawi Shop - We deliver across Malawi. WhatsApp 0999447090</footer>

</body>
</html>
