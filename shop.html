<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Malawi - Dropship Shop</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f5;margin:0}
header{background:#0b5d1e;color:white;text-align:center;padding:20px}
.container{max-width:900px;margin:20px auto;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:12px}
.card-body p{color:#0b5d1e;font-weight:bold}
.btn{display:block;text-align:center;background:#25D366;color:white;text-decoration:none;padding:10px;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>Connect Malawi Shop</h1>
<p>Call/WhatsApp: 0999447090</p>
</header>
<div class="container">
<div class="grid">

<div class="card">
<img src="YOUR_PHOTO_LINK_1" alt="Product">
<div class="card-body">
<h3>Premium Phone Cover</h3>
<p>MK 8,000</p>
<a class="btn" href="https://wa.me/265999447090?text=Hi!%20I%20want%20Premium%20Phone%20Cover">Order on WhatsApp</a>
</div>
</div>

<div class="card">
<img src="YOUR_PHOTO_LINK_2" alt="Product">
<div class="card-body">
<h3>Wireless Earphones</h3>
<p>MK 15,000</p>
<a class="btn" href="https://wa.me/265999447090?text=Hi!%20I%20want%20Wireless%20Earphones">Order on WhatsApp</a>
</div>
</div>

</div>
</div>
</body>
  </html>
